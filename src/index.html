<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#202124">
<title>Wen Browser</title>

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html,
body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    Roboto,
    Arial,
    sans-serif;
  background: #202124;
  color: #e8eaed;
}

body {
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

.app {
  height: 100%;
  display: flex;
  flex-direction: column;
}

/* =========================
   TOP BAR
========================= */

.topbar {
  background: #202124;
  border-bottom: 1px solid #3c4043;
  padding: 8px 10px;
}

.toolbar {
  width: 100%;
  max-width: 1300px;
  margin: auto;

  display: flex;
  align-items: center;
  gap: 6px;
}

.nav-button {
  width: 42px;
  height: 42px;
  min-width: 42px;

  border: 0;
  border-radius: 50%;

  background: transparent;
  color: #e8eaed;

  font-size: 25px;
  line-height: 1;

  cursor: pointer;
}

.nav-button:active {
  background: #3c4043;
}

.nav-button:disabled {
  opacity: 0.3;
}

/* =========================
   ADDRESS BAR
========================= */

.address-wrapper {
  flex: 1;
  min-width: 0;

  height: 44px;

  display: flex;
  align-items: center;

  background: #303134;
  border: 1px solid #5f6368;
  border-radius: 24px;

  padding: 0 7px 0 15px;
}

.lock {
  color: #9aa0a6;
  margin-right: 8px;
  font-size: 15px;
}

.address {
  flex: 1;
  min-width: 0;

  border: 0;
  outline: 0;

  background: transparent;
  color: #e8eaed;

  font-size: 16px;
}

.address::placeholder {
  color: #9aa0a6;
}

.go-button {
  height: 34px;
  padding: 0 15px;

  border: 0;
  border-radius: 18px;

  background: #8ab4f8;
  color: #202124;

  font-weight: 700;
  font-size: 13px;

  cursor: pointer;
}

.go-button:active {
  opacity: 0.75;
}

/* =========================
   WEB VIEW
========================= */

.browser {
  position: relative;
  flex: 1;
  min-height: 0;

  background: #fff;
}

iframe {
  width: 100%;
  height: 100%;

  border: 0;
  display: block;

  background: white;
}

/* =========================
   HOME PAGE
========================= */

.home {
  position: absolute;
  inset: 0;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 25px;

  background: #202124;
}

.home-card {
  width: min(700px, 100%);
  text-align: center;
}

.logo {
  font-size: clamp(38px, 8vw, 64px);
  font-weight: 700;
  letter-spacing: -3px;

  margin-bottom: 25px;
}

.home-search {
  width: 100%;
  height: 52px;

  padding: 0 20px;

  border: 1px solid #5f6368;
  border-radius: 27px;

  background: #303134;
  color: #e8eaed;

  outline: none;

  font-size: 17px;
}

.home-search:focus {
  border-color: #8ab4f8;
}

.home-search::placeholder {
  color: #9aa0a6;
}

.shortcuts {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;

  gap: 10px;

  margin-top: 22px;
}

.shortcut {
  border: 1px solid #5f6368;
  border-radius: 20px;

  padding: 9px 15px;

  background: #303134;
  color: #e8eaed;

  font-size: 14px;

  cursor: pointer;
}

.shortcut:active {
  background: #3c4043;
}

.description {
  margin-top: 25px;

  color: #9aa0a6;

  font-size: 13px;
  line-height: 1.5;
}

/* =========================
   STATUS
========================= */

.status {
  position: absolute;

  left: 50%;
  bottom: 18px;

  transform: translateX(-50%);

  display: none;

  max-width: 90%;

  padding: 10px 15px;

  border-radius: 12px;

  background: #303134;
  border: 1px solid #5f6368;

  color: #e8eaed;

  font-size: 13px;

  text-align: center;

  z-index: 10;
}

/* =========================
   IPAD / MOBILE
========================= */

@media (max-width: 700px) {

  .topbar {
    padding: 6px;
  }

  .toolbar {
    gap: 3px;
  }

  .nav-button {
    width: 37px;
    min-width: 37px;
    height: 40px;
    font-size: 23px;
  }

  .address-wrapper {
    height: 42px;
    padding-left: 12px;
  }

  .address {
    font-size: 15px;
  }

  .lock {
    display: none;
  }

  .go-button {
    height: 32px;
    padding: 0 12px;
  }
}

/* Prevent iPad zoom when focusing inputs */
@media screen and (max-width: 700px) {
  input {
    font-size: 16px !important;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- TOP BAR -->
  <header class="topbar">

    <div class="toolbar">

      <button
        class="nav-button"
        id="backButton"
        aria-label="Back">
        ‹
      </button>

      <button
        class="nav-button"
        id="forwardButton"
        aria-label="Forward">
        ›
      </button>

      <button
        class="nav-button"
        id="reloadButton"
        aria-label="Reload">
        ↻
      </button>

      <div class="address-wrapper">

        <span class="lock">🔒</span>

        <input
          id="addressBar"
          class="address"
          type="text"
          inputmode="url"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Search or enter a web address">

        <button
          class="go-button"
          id="goButton">
          GO
        </button>

      </div>

    </div>

  </header>


  <!-- BROWSER -->
  <main class="browser">

    <!-- HOME -->
    <section class="home" id="home">

      <div class="home-card">

        <div class="logo">
          Wen Browser
        </div>

        <input
          id="homeSearch"
          class="home-search"
          type="text"
          inputmode="url"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="Search or enter a web address">

        <div class="shortcuts">

          <button
            class="shortcut"
            data-url="https://www.google.com/">
            Google
          </button>

          <button
            class="shortcut"
            data-url="https://www.nicovideo.jp/">
            Niconico
          </button>

          <button
            class="shortcut"
            data-url="https://www.youtube.com/">
            YouTube
          </button>

        </div>

        <div class="description">
          A lightweight browser-style web viewer for iPad.
          Some websites don't allow themselves to be displayed
          inside another website and must be opened directly
          in Chrome or Safari.
        </div>

      </div>

    </section>


    <!-- WEBSITE VIEWER -->
    <iframe
      id="viewer"
      title="Web viewer"
      hidden
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>


    <!-- STATUS -->
    <div
      class="status"
      id="status">
    </div>

  </main>

</div>


<script>
(() => {

  const addressBar =
    document.getElementById("addressBar");

  const homeSearch =
    document.getElementById("homeSearch");

  const viewer =
    document.getElementById("viewer");

  const home =
    document.getElementById("home");

  const backButton =
    document.getElementById("backButton");

  const forwardButton =
    document.getElementById("forwardButton");

  const reloadButton =
    document.getElementById("reloadButton");

  const goButton =
    document.getElementById("goButton");

  const status =
    document.getElementById("status");


  /* =========================
     HISTORY
  ========================= */

  let historyList = [];
  let historyPosition = -1;


  /* =========================
     URL PROCESSING
  ========================= */

  function normalizeURL(input) {

    input = input.trim();

    if (!input) {
      return "";
    }

    /*
      Already has a protocol.
    */

    if (
      /^[a-zA-Z][a-zA-Z\d+\-.]*:\/\//
        .test(input)
    ) {
      return input;
    }


    /*
      Looks like a domain.
    */

    if (
      /^[\w.-]+\.[a-z]{2,}(\/.*)?$/i
        .test(input)
    ) {
      return "https://" + input;
    }


    /*
      Otherwise perform a Google search.
    */

    return (
      "https://www.google.com/search?q=" +
      encodeURIComponent(input)
    );
  }


  /* =========================
     STATUS MESSAGE
  ========================= */

  let statusTimer;

  function showStatus(message) {

    status.textContent = message;

    status.style.display = "block";

    clearTimeout(statusTimer);

    statusTimer = setTimeout(() => {

      status.style.display = "none";

    }, 4000);
  }


  /* =========================
     BUTTON STATE
  ========================= */

  function updateButtons() {

    backButton.disabled =
      historyPosition <= 0;

    forwardButton.disabled =
      historyPosition >=
      historyList.length - 1;
  }


  /* =========================
     LOAD WEBSITE
  ========================= */

  function loadWebsite(input, addHistory = true) {

    const url = normalizeURL(input);

    if (!url) {
      return;
    }


    addressBar.value = url;


    if (addHistory) {

      historyList =
        historyList.slice(
          0,
          historyPosition + 1
        );

      historyList.push(url);

      historyPosition++;
    }


    home.hidden = true;

    viewer.hidden = false;

    viewer.src = url;

    updateButtons();
  }


  /* =========================
     SUBMIT
  ========================= */

  function submit(input) {

    const value = input.value.trim();

    if (value) {

      loadWebsite(value);

    }
  }


  /* =========================
     ADDRESS BAR
  ========================= */

  goButton.addEventListener(
    "click",
    () => {

      submit(addressBar);

      addressBar.blur();

    }
  );


  addressBar.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        event.preventDefault();

        submit(addressBar);

        addressBar.blur();

      }

    }
  );


  /* =========================
     HOME SEARCH
  ========================= */

  homeSearch.addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {

        event.preventDefault();

        submit(homeSearch);

        homeSearch.blur();

      }

    }
  );


  /* =========================
     SHORTCUTS
  ========================= */

  document
    .querySelectorAll("[data-url]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          loadWebsite(
            button.dataset.url
          );

        }
      );

    });


  /* =========================
     BACK
  ========================= */

  backButton.addEventListener(
    "click",
    () => {

      if (historyPosition > 0) {

        historyPosition--;

        const url =
          historyList[historyPosition];

        addressBar.value = url;

        viewer.src = url;

        updateButtons();

      }

    }
  );


  /* =========================
     FORWARD
  ========================= */

  forwardButton.addEventListener(
    "click",
    () => {

      if (
        historyPosition <
        historyList.length - 1
      ) {

        historyPosition++;

        const url =
          historyList[historyPosition];

        addressBar.value = url;

        viewer.src = url;

        updateButtons();

      }

    }
  );


  /* =========================
     RELOAD
  ========================= */

  reloadButton.addEventListener(
    "click",
    () => {

      if (viewer.hidden) {
        return;
      }

      try {

        viewer.contentWindow.location.reload();

      } catch {

        viewer.src = viewer.src;

      }

    }
  );


  /* =========================
     PAGE LOADED
  ========================= */

  viewer.addEventListener(
    "load",
    () => {

      showStatus("Page loaded");

    }
  );


  /* =========================
     INITIAL STATE
  ========================= */

  updateButtons();

})();
</script>

</body>
</html>
